[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "chatlytics-hermes"
version = "4.8.1"
description = "Production-grade WhatsApp for Hermes Agent — full upstream contract, 22 tools, every media type, per-bot bearer auth (chatlytics v4.0 Multi-Bot Platform)"
license = {text = "MIT"}
readme = "README.md"
requires-python = ">=3.10"
authors = [{name = "Chatlytics", email = "dev@chatlytics.ai"}]
keywords = ["chatlytics", "hermes", "whatsapp", "adapter", "plugin"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Framework :: AsyncIO",
]
# hermes-agent is deliberately NOT listed (issue #4). It is the HOST this plugin
# loads into, never something the plugin installs. Declaring it let a plain
# `pip install` / `uv pip install` resolve the host DOWN (v4.1.1 did this to
# production; 2026-10-09 it broke `hermes update` on hpg6). The >=0.14 floor is
# enforced at load time by register() and the doctor instead.
# Every dependency below is LOWER-BOUND ONLY: an upper cap can force the
# resolver to downgrade a package the host already has. Do not add caps or
# hermes-agent here; tests/test_no_host_dependency.py fails if you do.
dependencies = [
    "httpx>=0.27",
    "aiohttp>=3.9",
    "PyYAML>=6.0",
    "jsonschema>=4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
]

[project.entry-points."hermes_agent.plugins"]
# Hermes' PluginManager imports the bare module and calls its module-level
# register(ctx). Must be the bare module path, NOT "chatlytics_hermes:register"
# (the colon form makes Hermes try to import an attribute named ``register``
# as a submodule and the plugin silently fails to load). Carried forward from
# hpg6's running tree (HERMES-compat fix #1).
chatlytics = "chatlytics_hermes"

[project.urls]
Homepage = "https://github.com/omernesh/chatlytics-hermes"
Repository = "https://github.com/omernesh/chatlytics-hermes"

[tool.setuptools]
# Pin the package explicitly so the root ``__init__.py`` (the Hermes
# directory-plugin shim — see repo-root ``__init__.py``) does NOT trip
# setuptools flat-layout auto-discovery ("Multiple top-level packages
# discovered" / treating the repo root as a flat-layout package). Only the
# bundled ``chatlytics_hermes`` package under ``src/`` is built/installed.
package-dir = {"" = "src"}
packages = ["chatlytics_hermes"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["src"]
